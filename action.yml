name: MFENX release receipt verification
description: Verify a release attestation, model bytes and an independently approved policy digest without executing a model
inputs:
  receipt:
    description: Local release receipt path
    required: true
  model:
    description: Local candidate model path
    required: true
  trusted-public-key:
    description: SPKI DER key provisioned independently from the untrusted change
    required: true
  approved-contract-sha256:
    description: Approved contract digest from protected configuration, never the candidate receipt
    required: true
runs:
  using: composite
  steps:
    - name: Verify pinned local Gate and receipt
      shell: bash
      env:
        MFENX_RECEIPT: ${{ inputs.receipt }}
        MFENX_MODEL: ${{ inputs.model }}
        MFENX_TRUST_KEY: ${{ inputs.trusted-public-key }}
        MFENX_APPROVED_CONTRACT: ${{ inputs.approved-contract-sha256 }}
      run: |
        set -euo pipefail
        test "$(mfenx-gate --version)" = 'mfenx-gate 1.0.0'
        mfenx-gate verify \
          --trusted-public-key="$MFENX_TRUST_KEY" \
          --model="$MFENX_MODEL" \
          --expected-contract-sha256="$MFENX_APPROVED_CONTRACT" \
          -- "$MFENX_RECEIPT"
